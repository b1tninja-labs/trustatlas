# Two things live here: stdlib-only collector scripts in `tools/`, which write artifacts and are not installed,
# and the importable `trustatlas` library in `src/`, which reads those artifacts and joins them (row `ta.package`,
# the owner's decision of 2026-11-15, recorded in `AGENTS.md` first as this file used to require). The build
# backend below exists for the library alone: the wheel carries `src/trustatlas` and nothing from `tools/`.
# Publishing it to PyPI still waits on the off-PyPI brand check and on `cl.aup-review`.

[build-system]
requires = ["hatchling>1.25"]
build-backend = "hatchling.build"

[project]
name = "trustatlas"
version = "0"
description = "Which trust store lists which certificate or key, how each answer is known, and where programs disagree: collectors plus a library that reads their artifacts"
readme = "PLAN.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
# Empty, and that emptiness is the design goal rather than an accident, for the library as much as the scripts.
# `ROADMAP.md` §4 says why: parsing anchors is `asn1core`, path and issuer links
# are `pkix`, CT is `ctspy`, storage and coverage states are `certledger`. A runtime dependency here would
# be the first step toward growing a second, laxer PKI in the pipeline — the one thing a trust map cannot
# survive. So no `certifi` (the collectors take `--url` instead), no `cryptography`, nothing. The image is
# `python:3.12-slim` with no install step at all, and it stays that way.
dependencies = []

[project.optional-dependencies]
# Every pin here matches projecthub's pinned toolchain (`requirements-dev.txt`) exactly, on purpose. A gate
# whose verdict moves with whatever pip fetched today is weather and not a gate: projecthub's own CI went red
# on a commit that passed locally because an unpinned `pip install ruff` pulled a version enabling a rule the
# pinned one accepts. One linter version therefore serves every project in this workspace, and a green here
# means the same thing as a green there. `mcp` is projecthub's runtime dependency rather than a gate, so it
# is not repeated here.
dev = ["ruff==0.15.12", "mypy==1.20.2", "pytest==9.0.3", "coverage==7.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/trustatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools` and `src`, never `.`: the scripts are imported by module name (`import collect_bundle`) and the library
# from its src layout (`import trustatlas`). Putting `.` on the path instead would make pytest prepend the
# repository root for every test file and invite a stray top-level module to shadow something real; the src
# layout is what lets the library be imported in tests without that.
pythonpath = ["tools", "src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
# The scripts and the library are both measured: either can regress, and the floor below binds both.
source = ["tools", "src"]

[tool.coverage.report]
# 85, and set before the tests that have to earn it exist. The convention elsewhere in this workspace is a
# floor at what is measured today, ratcheted up in the commit that implements something; here the direction
# is reversed on purpose. `ROADMAP.md`'s honesty rule says a row may read `[ok]` only when a named test would
# fail if the behaviour regressed, and a low floor lets a collector land at 40% with its defect-prone paths —
# the label walk, the tar extractor, the refusal branches — untouched while the gate still reports green. The
# number is therefore a promise item 2..8 must keep, not a report of where things stand. It bites only when
# coverage is actually run (`python -m coverage run -m pytest`): `addopts` carries no `--cov`, so a bare
# `python -m pytest -q` stays green today with no `tests/` directory yet, and would exit 5 ("no tests ran")
# if it did. Lowering this line needs the same justification as deleting a test.
fail_under = 85
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  # The refusal paths that end a script rather than return from it. `raise SystemExit(main())` is how every
  # tool here reports its exit code, and pinning the CLI's contract means calling `main()` directly; the
  # module boundary itself earns no coverage.
  "raise SystemExit",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501", # line length is the formatter's job
  # S101 is `assert`, and there is no other way to state an expectation in a test. The rule is off for the
  # whole tree rather than only under `per-file-ignores` because the tools assert too: `collect_bundle.py`
  # refuses a bundle whose digests do not add up, which is a self-check and not test code. certledger turns
  # it off the same way; asn1core leaves it on and carries a written policy naming each line instead.
  "S101",
  # S310 (opening a URL), S603 (running a subprocess) and S607 (by a partial path) flag reaching the network
  # and running an external binary as if either were the bug. Both are this directory's entire job:
  # `collect_bundle.py --url` fetches, `--reader keytool` asks a store's own reader to print its contents so
  # no PKI format gets implemented here. They are nevertheless left *enabled*, not listed here, because the
  # controls that matter are explicit and each is a named line in the source — `ssl.create_default_context()`
  # on every fetch, argv passed as a list with `# noqa: S603` rather than through a shell, byte caps on what a
  # response may be — and a `# noqa` marker is only load-bearing while its rule is enabled. Ruff treats an
  # ignored rule as non-enabled, so RUF100 reports every marker for it as unused: ignoring these three here
  # once turned the whole audit trail for "this fetch verifies TLS" into dead directives. Enabled, a new
  # fetch or subprocess fails the lint until someone writes the marker beside its control, and RUF100 fails
  # on a marker left on a line whose call went away.
]

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a fixture's throwaway value rather than a token, and a test double has
# to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S105", "S106", "S311", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
# `tools` and not a package, matching the pytest path above. Item 16 runs `mypy tools tests`; both are listed
# so a bare `python -m mypy` in the directory checks the same thing that gate does rather than staying silent
# about the suite, where "Success" would otherwise mean something narrower than it reads as.
files = ["tools", "src", "tests"]
